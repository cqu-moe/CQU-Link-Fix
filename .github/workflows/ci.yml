name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  source:
    name: Source checks and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify source, types, tests, and build
        run: pnpm verify
      - name: Package extension
        run: pnpm zip
      - name: Record package checksum
        run: cd .output && sha256sum cqu-link-fix-*-chrome.zip > cqu-link-fix-checksums.txt
      - name: Upload main extension package
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cqu-link-fix-extension
          path: |
            .output/*-chrome.zip
            .output/cqu-link-fix-checksums.txt
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Chromium extension E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run loaded-extension E2E
        run: pnpm test:e2e
      - name: Upload browser reports
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cqu-link-fix-browser-reports
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  ci-result:
    name: CI result
    needs:
      - source
      - browser
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every CI job to pass
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$BROWSER_RESULT" = success

  release:
    name: Immutable tag package
    needs: ci-result
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate version and main ancestry
        run: |
          version="${GITHUB_REF_NAME#v}"
          node --input-type=module - "$version" <<'NODE'
          import { readFile } from "node:fs/promises";
          const expected = process.argv[2];
          const pkg = JSON.parse(await readFile("package.json", "utf8"));
          if (pkg.version !== expected) {
            throw new Error(`package.json ${pkg.version} does not match tag v${expected}`);
          }
          NODE
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Build and verify archive
        run: |
          pnpm zip
          version="${GITHUB_REF_NAME#v}"
          zip_file=".output/cqu-link-fix-${version}-chrome.zip"
          test -f "$zip_file"
          unzip -t "$zip_file"
          sha256sum "$zip_file" > "${zip_file}.sha256"
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          This release contains the WXT Chrome Extension archive and its SHA-256 checksum.

          The same tag workflow reran source checks and Chromium E2E before publishing.
          Chrome Web Store and Microsoft Edge Add-ons submission remain manual maintainer actions.
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            ".output/cqu-link-fix-${version}-chrome.zip" \
            ".output/cqu-link-fix-${version}-chrome.zip.sha256" \
            --verify-tag \
            --title "CQU Link Fix v${version}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
